name: Agent data checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/generate-agent-plan.cjs --check
      - run: node --test tests/agent-data.test.cjs tests/agent-cloud.test.cjs
