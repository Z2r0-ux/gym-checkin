<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0b0d12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="训练打卡" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
<link rel="stylesheet" href="./styles.css" />
<title>训练打卡</title>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <h1 id="appTitle">训练打卡</h1>
      <p id="todayText">身体重组 · 增肌 · 力量</p>
    </div>
    <button class="iconbtn" id="quickExport" aria-label="导出">↗</button>
  </div>

  <section id="viewWorkout" class="view active">
    <div class="hero">
      <div class="heroTop">
        <div>
          <div class="eyebrow" id="heroEyebrow">今日训练</div>
          <h2 class="heroTitle" id="heroTitle">Push A</h2>
          <div class="heroSub" id="heroSub">胸 + 肩 + 三头</div>
        </div>
        <div class="ring" id="progressRing">
          <div style="position:relative;z-index:2;text-align:center">
            <b id="progressPct">0%</b>
            <small>完成度</small>
          </div>
        </div>
      </div>
      <div class="heroStats">
        <div class="heroStat"><b id="statSets">0/0</b><span>工作组</span></div>
        <div class="heroStat"><b id="statEx">0/0</b><span>动作</span></div>
        <div class="heroStat"><b id="statTime">60–80</b><span>分钟</span></div>
      </div>
    </div>

    <div class="daystrip" id="dayStrip"></div>

    <div class="sectionTitle">
      <h2>训练动作</h2>
      <span>点开即可开始</span>
    </div>
    <div id="exerciseList"></div>

    <div class="quickNotes">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">今日备注</div>
      <textarea id="dayNote" placeholder="睡眠、精神、酸痛、异常感觉……"></textarea>
    </div>

    <button class="finishBtn" id="finishWorkout">完成今天训练</button>
  </section>

  <section id="viewProgress" class="view">
    <div class="sectionTitle" style="margin-top:4px">
      <h2>训练记录</h2><span>最近完成</span>
    </div>
    <div id="historyList"></div>
  </section>

  <section id="viewMore" class="view">
    <div class="sectionTitle" style="margin-top:4px">
      <h2>每日目标</h2><span id="targetPhase">身体重组</span>
    </div>
    <div class="nutrition" id="dailyTargets"></div>

    <div class="sectionTitle"><h2>饮食原则</h2><span>直接执行</span></div>
    <div class="settingsCard" id="nutritionPrinciples"></div>

    <div class="sectionTitle"><h2>数据</h2><span>本机保存</span></div>
    <div class="settingsCard">
      <div class="settingsRow">
        <div class="left"><b>导出训练记录</b><span>发给教练后可直接据此调重量和组次</span></div>
        <button class="smallBtn" id="exportBtn">导出</button>
      </div>
      <div class="settingsRow">
        <div class="left"><b>导入训练记录</b><span>换手机或浏览器后恢复</span></div>
        <label class="smallBtn" for="importInput">导入</label>
        <input id="importInput" class="hidden" type="file" accept=".json">
      </div>
      <div class="settingsRow">
        <div class="left"><b>重置当前训练日</b><span>只清空当前这一天的打卡</span></div>
        <button class="smallBtn" id="resetDay">重置</button>
      </div>
    </div>
  </section>
</div>

<div class="bottomNav">
  <button class="navBtn active" data-view="Workout"><span class="ico">●</span><span>训练</span></button>
  <button class="navBtn" data-view="Progress"><span class="ico">◫</span><span>记录</span></button>
  <button class="navBtn" data-view="More"><span class="ico">•••</span><span>更多</span></button>
</div>

<div class="restTimer" id="restTimer">
  <div class="timerText"><small>组间休息</small><b id="timerDisplay">01:30</b></div>
  <div class="timerActions">
    <button id="timerPlus">+30s</button>
    <button id="timerSkip">跳过</button>
  </div>
</div>

<div class="sheet" id="finishSheet">
  <div class="sheetCard">
    <h3>完成今天训练？</h3>
    <p id="finishSummary">今天共完成 0 组。</p>
    <p>完成后会写入训练记录。你仍然可以返回继续修改今天的数据。</p>
    <div class="sheetActions">
      <button class="ghost" id="sheetCancel">继续训练</button>
      <button class="primary" id="sheetConfirm">完成训练</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="./data/profile.js"></script>
<script src="./data/program.js"></script>
<script src="./app.js"></script>
</body>
</html>
